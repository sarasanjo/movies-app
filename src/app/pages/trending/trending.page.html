<div class="container mx-auto p-4">
  <h1 class="text-3xl font-bold mb-6">Trending</h1>

  <div class="flex flex-col gap-4">
    @for (movie of trendingMovies(); track movie.id) {
      <movie-card [movieOrProgram]="movie" (infoClick)="openMovieDetails($event)" />
    }
  </div>

  <mat-paginator
    class="mt-6"
    [length]="totalResults"
    [pageIndex]="currentPage - 1"
    [pageSize]="20"
    [hidePageSize]="true"
    showFirstLastButtons
    (page)="onPageChange($event)"
  >
  </mat-paginator>
</div>
